<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Kcal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% if ui_scale and ui_scale != 1.0 %}
  <style>html { zoom: {{ ui_scale }}; }</style>
  {% endif %}
</head>
<body class="{{ 'show-cursor' if show_cursor else '' }}">
  <div id="app">
    <header class="app-header" id="appHeader">
      <button class="icon-button" id="todayBtn" aria-label="Today">Today</button>
      <button class="icon-button nav-button" id="prevBtn" aria-label="Previous">&#8249;</button>
      <button class="icon-button nav-button" id="nextBtn" aria-label="Next">&#8250;</button>
      <h1 id="rangeLabel" class="range-label"></h1>
      <div class="header-spacer"></div>
      <button class="icon-button tasks-button" id="tasksBtn" aria-label="Tasks">Tasks</button>
      <div class="view-toggle" role="group" aria-label="View">
        <button class="view-toggle-btn" data-view="month" id="monthBtn">Month</button>
        <button class="view-toggle-btn" data-view="week" id="weekBtn">Week</button>
        <button class="view-toggle-btn active" data-view="week2" id="week2Btn">2 Week</button>
        <button class="view-toggle-btn" data-view="week3" id="week3Btn">3 Week</button>
        <button class="view-toggle-btn" data-view="list" id="listBtn">List</button>
      </div>
      <button class="icon-button" id="refreshBtn" aria-label="Refresh">&#8635;</button>
      <button class="icon-button" id="fullscreenBtn" aria-label="Toggle fullscreen">&#9974;</button>
      <a class="icon-button settings-link" href="{{ url_for('settings') }}" aria-label="Settings">&#9881;</a>
    </header>

    <div id="forecastStrip" class="forecast-strip hidden"></div>

    <main id="content" class="content">
      <div id="contentInner" class="content-inner"></div>
      <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <div class="loading-text">Loading&hellip;</div>
      </div>
    </main>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-backdrop" id="overlayBackdrop"></div>
    <div class="overlay-panel">
      <button class="overlay-close" id="overlayClose" aria-label="Close">&times;</button>
      <div id="overlayBody"></div>
    </div>
  </div>

  <div id="disconnectedScreen" class="disconnected-screen hidden">
    <h2>Calendar disconnected</h2>
    <p>Run <code>python authorize.py</code> on the host machine, then reload.</p>
    <button id="retryBtn">Retry</button>
  </div>

  <canvas id="confettiCanvas" class="confetti-canvas hidden"></canvas>

  <div id="sleepScreen" class="sleep-screen"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
